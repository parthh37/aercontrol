name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        type: string
        default: ""
      release_tag:
        description: Upload installers to this GitHub release
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Unit tests (payload/status vectors, settings, schedule, updates)
        run: swift test

      - name: Build CLI + dev app (SwiftPM)
        run: |
          swift build -c release --product aerctl
          ./scripts/bundle-dev-app.sh
          cp .build/release/aerctl dist/aerctl
          (cd dist && zip -q aerctl-macOS.zip aerctl)

      - name: Build app + widget with Xcode
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          if [ -n "${{ inputs.release_tag }}" ]; then
            # Release without Apple credentials: ad-hoc signed ("Sign to Run Locally").
            SIGN=(CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=)
          else
            SIGN=(CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=)
          fi
          xcodebuild -project AerControl.xcodeproj -scheme AerControl -configuration Release \
            -derivedDataPath build/dd "${SIGN[@]}" build
          test -d build/dd/Build/Products/Release/AerControl.app/Contents/PlugIns/AerControlWidget.appex

      - name: Package DMG (ad-hoc signed)
        if: inputs.release_tag != '' && env.HAS_SIGNING != 'true'
        run: |
          mkdir -p build/dmg && cp -R build/dd/Build/Products/Release/AerControl.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname AerControl -srcfolder build/dmg -ov -format UDZO dist/AerControl-macOS.dmg

      # Signed + notarized when the repository has Apple credentials: MACOS_CERT_P12 (base64),
      # MACOS_CERT_PASSWORD, APPLE_TEAM_ID, APPLE_ID, APPLE_APP_PASSWORD.
      - name: Signed + notarized DMG
        if: inputs.release_tag != '' && env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC=build.keychain; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" $KC
          security set-keychain-settings $KC && security unlock-keychain -p "$KCPW" $KC
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k $KC -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" $KC
          security list-keychains -d user -s $KC login.keychain
          xcrun notarytool store-credentials aercontrol-notary --apple-id "$APPLE_ID" \
            --team-id "$DEVELOPMENT_TEAM" --password "$APPLE_APP_PASSWORD"
          ./scripts/release.sh
          cp build/release/AerControl.dmg dist/AerControl-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: aercontrol-macos
          path: |
            macos/dist/*.zip
            macos/dist/*.dmg

      - name: Upload to release
        if: inputs.release_tag != ''
        run: gh release upload "${{ inputs.release_tag }}" dist/AerControl-macOS.dmg dist/aerctl-macOS.zip --clobber
