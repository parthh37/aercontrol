name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Unit tests (payload/status vectors, BLE session, settings, updates)
        if: matrix.platform == 'x64'
        run: dotnet test AerControl.Portable.slnf -c Release

      # Releases need a persistent certificate (WINDOWS_CERT_PFX base64 + WINDOWS_CERT_PASSWORD)
      # so that Windows accepts updates. Branch builds fall back to a throwaway one.
      - name: Signing certificate
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force certs | Out-Null
          if ($env:WINDOWS_CERT_PFX) {
            [IO.File]::WriteAllBytes("certs/AerControl-Dev.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $pfx = Get-PfxData -FilePath certs/AerControl-Dev.pfx -Password (ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force)
            Export-Certificate -Cert $pfx.EndEntityCertificates[0] -FilePath certs/AerControl-Dev.cer | Out-Null
            "CERT_PASSWORD=$env:WINDOWS_CERT_PASSWORD" >> $env:GITHUB_ENV
          } elseif ("${{ inputs.release_tag }}") {
            throw "Releases need the WINDOWS_CERT_PFX / WINDOWS_CERT_PASSWORD secrets (see README › Releasing)."
          } else {
            ./scripts/new-dev-cert.ps1 -Password "aercontrol-ci"
            "CERT_PASSWORD=aercontrol-ci" >> $env:GITHUB_ENV
          }

      - name: Build MSIX + CLI
        run: ./scripts/build-msix.ps1 -Platform ${{ matrix.platform }} -CertPassword $env:CERT_PASSWORD

      - name: Release assets (msix, .appinstaller, zip)
        run: ./scripts/package-release.ps1 -Platform ${{ matrix.platform }} -Tag "${{ inputs.release_tag || 'v0.0.0-ci' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: aercontrol-windows-${{ matrix.platform }}
          path: windows/release/*

      - name: Upload to release
        if: inputs.release_tag != ''
        run: gh release upload "${{ inputs.release_tag }}" (Get-ChildItem release/* | ForEach-Object FullName) --clobber
